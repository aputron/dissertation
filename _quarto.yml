project:
  type: book

book:
  title: "Computational Approaches to Biofoundry-based Protein Engineering and Synthetic Biology "
  author: "Aporva Kamath"

  chapters:
    - index.qmd
    # - chapters/abstract.qmd
    - chapters/introduction.qmd
    - chapters/computational_tools.qmd
    - chapters/data_coll.qmd
    - chapters/mutant_gen.qmd
    - chapters/dsembler.qmd
    # - chapters/design.qmd
    # - chapters/build.qmd
    # - chapters/test.qmd
    # - chapters/learn.qmd
    # - chapters/evaluation.qmd
    - chapters/conclusion.qmd
    - chapters/references.qmd
    - chapters/appendix.qmd

pseudocode:
  caption-prefix: "Algorithm"
  reference-prefix: "Algorithm"
  caption-number: true

crossref:
  custom:
    - kind: float
      key: algo
      reference-prefix: "Algorithm"
      caption-prefix: "Algorithm"
      latex-env: algo
      latex-list-of-description: Algorithm

filters:
  - pseudocode

bibliography: references.bib
csl: american-chemical-society.csl

format:
  html:
    theme: cosmo
    include-in-header:
      text: |
        <script>
        MathJax = {
          loader: {
            load: ['[tex]/boldsymbol']
          },
          tex: {
            tags: "all",
            inlineMath: [['$','$'], ['\\(','\\)']],
            displayMath: [['$$','$$'], ['\\[','\\]']],
            processEscapes: true,
            processEnvironments: true,
            packages: {
              '[+]': ['boldsymbol']
            }
          }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>

